<svg xmlns="http://www.w3.org/2000/svg" width="960" height="355" viewBox="0 0 960 355" role="img" aria-labelledby="title desc">
<title id="title">BeatPulse - deployed web and Android architecture</title>
<desc id="desc">Responsive website and native Android app connect to a shared Node.js API on Vercel. Domain modules use Supabase Auth, private Storage and PostgreSQL functions. PostgreSQL schedules tasks and sends private real-time invalidation events. Offline caches and location services run on clients.</desc>
