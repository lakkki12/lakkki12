<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Lakshya Agarwal — Midnight Minimal GitHub Banner</title>
  <desc id="desc">Minimal midnight navy banner featuring Lakshya Agarwal, software engineering and applied AI research, with a delicate cyan grid and technical motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080f1e"/>
      <stop offset="0.62" stop-color="#101d32"/>
      <stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54e3de"/>
      <stop offset="1" stop-color="#5f90ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9dc8dc" stroke-width="0.7" opacity="0.10"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <path d="M0 299H1200" stroke="#54e3de" stroke-opacity=".22"/>
    <path d="M870 -50L1210 290M960 -50L1300 290M1050 -50L1390 290" stroke="#6bdbe5" stroke-width="1" opacity=".12"/>
    <circle cx="1016" cy="144" r="116" stroke="#66d9e7" stroke-opacity=".18" fill="none"/>
    <circle cx="1016" cy="144" r="80" stroke="#66d9e7" stroke-opacity=".12" fill="none"/>
    <circle cx="1016" cy="144" r="44" stroke="#66d9e7" stroke-opacity=".10" fill="none"/>
    <path d="M960 133L944 145L960 157M1072 133L1088 145L1072 157M1032 117L1000 174" stroke="url(#line)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".82"/>
    <path d="M106 69H142" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <text x="155" y="74" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3.2" fill="#75d8df">SOFTWARE ENGINEERING  /  RESEARCH</text>
    <text x="102" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.8" fill="#F5F8FC">Lakshya Agarwal</text>
    <path d="M104 180H557" stroke="#83abc2" stroke-width="1" stroke-opacity=".34"/>
    <text x="103" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBD8E8">C++ &amp; CUDA  <tspan fill="#4FBBC8">·</tspan>  Full-Stack Development  <tspan fill="#4FBBC8">·</tspan>  Applied AI</text>
    <text x="104" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="0.55" fill="#88A2BC">BUILD WITH PURPOSE. MEASURE WITH RIGOR.</text>
    <circle cx="1148" cy="40" r="3" fill="#65E4D8" opacity=".7"/>
    <path d="M1134 40H1096M1148 54V83" stroke="#65E4D8" stroke-opacity=".3"/>
  </g>
  <g fill="none" stroke="#54e3de" stroke-width="2" opacity=".5">
    <circle cx="1016" cy="144" r="97" stroke-dasharray="5 16">
      <animateTransform attributeName="transform" type="rotate" from="0 1016 144" to="360 1016 144" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1016" cy="144" r="65" stroke="#5f90ff" stroke-dasharray="2 14">
      <animateTransform attributeName="transform" type="rotate" from="360 1016 144" to="0 1016 144" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="1148" cy="40" r="5" fill="#65e4d8">
    <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M800 0L1100 300" fill="none" stroke="#54e3de" stroke-width="1" stroke-opacity=".25" stroke-dasharray="30 350">
    <animate attributeName="stroke-dashoffset" from="380" to="0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>